# Copy this template into the project repository as PROJECT_PROFILE.yml or PROJECT_PROFILE.md.
project:
  id: "REPLACE_WITH_STABLE_PROJECT_ID"
  name: "REPLACE_WITH_PROJECT_NAME"
  repository: "https://github.com/OWNER/REPOSITORY"
  default_branch: "main"
  canonical_operations_board: "https://github.com/OWNER/REPOSITORY/issues/NUMBER"
  # Set a path or URL only after the owner explicitly declares an independent roadmap.
  # Never infer a roadmap from the canonical operations board.
  roadmap: "NONE"

continuation:
  commands:
    ".": "Continue the current task from its latest verified state; perform the next safe, authorized action."
    "..": "Reinspect open tasks on the canonical operations board, prioritize by dependencies, risks and acceptance gates, then execute the highest-priority safe task."
    "...": "DISABLED_WHEN_ROADMAP_NONE; when an independent roadmap is declared, reassess roadmap priorities; otherwise report Roadmap: NONE and follow the .. behavior."
  behavior: "Do not replace execution with a status-only recap. All commands remain subordinate to security and approval gates."

environments:
  registered_lab_hosts: []
  production_hosts: []
  access_procedure: "NOT_DECLARED"

permissions:
  merge: "EXPLICIT_GATE"
  release: "EXPLICIT_GATE"
  deploy: "EXPLICIT_GATE"
  real_host_operations: "TASK_SPECIFIC_OWNER_AUTHORIZATION_REQUIRED"

rules:
  - "Never copy credentials or secret values into this profile."
  - "Unlisted or unidentified hosts are production/out of scope."
  - "Project-specific architecture and acceptance criteria remain in the project repository."
